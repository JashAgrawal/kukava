services:
  app:
    build:
      context: .
      target: runtime
    image: kukava:latest
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
    # env_file is intentionally not used: .env is gitignored, so an absent file
    # would break `docker compose up` for anyone who cloned fresh.
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s